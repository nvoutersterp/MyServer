# and pushes it to GitHub Container Registry (GHCR) whenever main changes.
 
name: Build and Push Docker Image
 
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "**/Dockerfile"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch: {}
 
env:
  REGISTRY: ghcr.io
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # GHCR requires lowercase image names; github.repository can contain
      # uppercase letters (e.g. nvoutersterp/MyServer), so normalize it.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
 
      - name: Set up QEMU (enables arm64 builds on the x86 GitHub runner)
        uses: docker/setup-qemu-action@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
